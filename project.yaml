description:
  short: "A C++ Gaussian elimination solver for Ax=b with partial pivoting and unique/infinite/no-solution detection."
  long: |
    Solves systems of linear equations via Gaussian elimination with
    partial pivoting, printing the augmented matrix before and after
    elimination and classifying the result as a unique solution, infinite
    solutions, or no solution (using an epsilon tolerance for near-zero
    comparisons). Built for a Linear Algebra course (Air University,
    Semester 2, Spring 2024).

